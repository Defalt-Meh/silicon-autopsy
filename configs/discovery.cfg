# discovery.cfg — complete exploratory configuration (DISCOVERY phase).
#
# Run this in several independent sessions (different times / days, fresh
# process each time, AC power, Low Power Mode off). Candidate regimes and
# hypotheses are derived from these data ONLY; they are then frozen and
# tested on separately collected confirmation data (configs/confirmation.cfg,
# written after the freeze).
#
# Sizes are binary (K = KiB, M = MiB, G = GiB). No cache capacities are
# assumed anywhere: all sweeps are uniform in log2(size).
name  = discovery-v1
phase = discovery
reps  = 3                # repetitions of every cell within one session

n_min = 64K              # short launch: at least 64K dependent loads,
min_traversals = 1       # at least one full traversal of the chain (hard rule),
target_traversals = 8    # and 8 traversals where that costs <= n_budget loads
n_budget = 2M
long_ratio = 2           # long launch = 2 x short launch
n_max = 16M              # cells needing longer chains are skipped (reported)
spin_n = 2M              # clock spin-up per trial (~25 ms)
alu_ref_n = 64K          # clock reference before/between/after timed encoders

sentinel_every = 10      # fixed drift-sentinel cell every 10 trials
sentinel_ws = 4K
sentinel_stride = 64

bw_threads = 65536
bw_tg = 256
bw_min_bytes = 256M      # short bandwidth launch reads >= 256 MiB
session_warmup_s = 2

# E1 — primary: random dependent chase, working-set sweep, 4 points/octave.
# Stride 64 B places consecutive slots 64 B apart (dense coverage of W if the
# line size is >= 64 B; E2 tests this assumption).
[E1_ws_random]
kind = chase
pattern = random
ws = logspace 1K 128M 4
stride = 64

# E1b — TLB discrimination: one slot per OS page (hw.pagesize = 16 KiB).
# Touches only W/16K distinct lines, so cache-capacity transitions move to
# much larger W while page-count (TLB-like) transitions stay at the same
# number of pages.
[E1b_ws_random_pagestride]
kind = chase
pattern = random
ws = logspace 32K 1G 4
stride = 16K

# E2 — stride sweep, sequential pattern (spatial-locality / line-size probe),
# at four working sets spread uniformly in log2(size).
[E2_stride_sequential]
kind = chase
pattern = sequential
ws = 16K, 256K, 4M, 32M
stride = 4, 8, 16, 32, 64, 128, 256, 512, 1K, 2K, 4K, 8K, 16K, 32K, 64K

# E3 — sequential vs random (E1 provides the random arm at identical cells).
[E3_ws_sequential]
kind = chase
pattern = sequential
ws = logspace 1K 128M 4
stride = 64

# E4 — streaming read bandwidth, 2 points/octave.
[E4_bandwidth]
kind = bandwidth
ws = logspace 16K 1G 2
