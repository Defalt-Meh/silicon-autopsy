# smoke.cfg — quick end-to-end check of the whole pipeline (about a minute).
# Output goes to data/raw/smoke/, which is excluded from all real analyses.
name  = smoke
phase = smoke
reps  = 2

n_min = 16K          # minimum dependent loads in the short launch
n_max = 4M           # cap on the long launch; cells needing more are skipped
min_traversals = 1   # short launch covers >= 1 full traversal of the chain
target_traversals = 8  # ... and 8 traversals where that costs <= n_budget loads
n_budget = 1M
long_ratio = 2       # n_long = 2 * n_short
alu_ref_n = 64K      # ALU clock-reference steps (start, middle, end of each trial)
spin_n = 2M          # ALU clock spin-up at the start of each trial (~25 ms)

sentinel_every = 10
sentinel_ws = 4K
sentinel_stride = 64

bw_threads = 65536
bw_tg = 256
bw_min_bytes = 16M
session_warmup_s = 1

[ws_random]
kind = chase
pattern = random
ws = logspace 1K 64M 1
stride = 64

[ws_sequential]
kind = chase
pattern = sequential
ws = 4K, 1M, 64M
stride = 64

[stride_seq]
kind = chase
pattern = sequential
ws = 16M
stride = 16, 64, 1K, 16K

[bandwidth]
kind = bandwidth
ws = 64K, 4M, 64M
